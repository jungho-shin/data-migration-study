services:
  hdfs-to-iceberg:
    build: .
    container_name: hdfs-to-iceberg
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - SPARK_MASTER=spark://spark-master:7077
      - HDFS_NAMENODE=namenode:9000
    networks:
      - data-migration-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  data-migration-network:
    external: true
    name: infra_data-migration-network
